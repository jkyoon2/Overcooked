data:
  n_obs: 6
  horizon: 16
  n_action_steps: 8
  action_dim: 6
  label_smoothing: 0.02
  train_files_per_recipe: 3
  val_files_per_recipe: 1
  test_files_per_recipe: 1

model:
  obs_emb_dim: 64
  goal_emb_dim: 64
  down_dims: [128, 256, 512]

diffusion:
  num_diffusion_steps: 100
  beta_start: 0.0001
  beta_end: 0.02
  inference_steps: 50
  smoke_inference_steps: 4
  scheduler_method: ddim
  eta: 0.0

training:
  batch_size: 128
  epochs: 3000
  learning_rate: 0.0001
  weight_decay: 0.000001
  p_uncond: 0.1
  grad_clip_norm: 1.0
  num_workers: 0
  log_interval: 20
  save_interval_epochs: 100
  eval_max_batches: null
  max_train_steps: 100000

logging:
  use_wandb: true
  project: Overcooked-Diffusion
  entity: null
  name: null
  tags: [1_forced_easy, split3_1_1, long, nobs6]

paths:
  output_root: results
  experiment_name: diffusion_1_forced_easy_nobs6_split3_1_1_long
