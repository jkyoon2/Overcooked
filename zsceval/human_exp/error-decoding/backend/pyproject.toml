[project]
name = "neurocontroller-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.7.0",
    "websockets>=12.0",
    "absl-py>=2.4.0",
    "gymnasium>=1.3.0",
    "gym>=0.26,<1.0",
    "pygame>=2.6.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["."]
# ".." adds zsceval/human_exp/ to sys.path so backend.* imports resolve
pythonpath = [".."]

[tool.ruff]
target-version = "py311"
line-length = 88
